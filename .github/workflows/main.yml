name: Android & Rust Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Java-Umgebung für Gradle einrichten
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. Rust Toolchain und Android-Targets installieren
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      # 3. cargo-ndk installieren (wie im ersten Bild gefordert)
      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      # 4. Native Rust-Bibliotheken kompilieren und in den jniLibs-Ordner ablegen
      - name: Build Rust native library
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -o app/src/main/jniLibs build --release

      # 5. APK über Gradle kompilieren (wie im ersten Bild gefordert)
      - name: Build Android APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # 6. Die fertige APK als Download-Artefakt bereitstellen
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
